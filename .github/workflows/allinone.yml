name: All-in-one DevOps and security

# Configuration only: each group of checks lives in its own reusable workflow,
# called below from this repository at the same commit as this file.

on:
  workflow_call:
    inputs:
      mode:
        description: "audit (report), restrict (fail), or advanced (report and attempt dependency PRs)"
        type: string
        default: audit
      # Quality
      lint:
        description: Run Super-Linter on the repository
        type: boolean
        default: true
      # Build and test
      python:
        description: Install Python requirements and run tests
        type: boolean
        default: false
      docker:
        description: Build a Docker image without pushing it
        type: boolean
        default: false
      # Infrastructure as code
      terraform:
        description: Check formatting and validate Terraform without a backend
        type: boolean
        default: false
      bicep:
        description: Compile and validate Bicep templates without deploying
        type: boolean
        default: false
      cloudformation:
        description: Lint CloudFormation templates
        type: boolean
        default: false
      # Security
      trivy:
        description: Scan vulnerabilities, secrets, and infrastructure misconfiguration
        type: boolean
        default: true
      iac-security:
        description: Run Checkov security and best-practice checks on IaC
        type: boolean
        default: true
      codeql:
        description: Opt in to GitHub CodeQL analysis and code-scanning uploads
        type: boolean
        default: false
      dependabot:
        description: Check existing open high and critical GitHub Dependabot alerts
        type: boolean
        default: false
      dependency-review:
        description: Review newly introduced vulnerable dependencies on pull requests
        type: boolean
        default: false
      secret-scanning:
        description: Check existing open GitHub secret-scanning alerts
        type: boolean
        default: false
      # Dependencies
      versions:
        description: Check dependency versions, including Actions and Terraform providers
        type: boolean
        default: true
      # Check settings
      python-version:
        type: string
        default: "3.12"
      python-requirements:
        description: Optional requirements file; an empty value skips installation
        type: string
        default: ""
      python-command:
        description: Trusted shell command supplied by the calling workflow
        type: string
        default: python -m unittest discover -v
      docker-context:
        type: string
        default: "."
      dockerfile:
        type: string
        default: Dockerfile
      terraform-directory:
        description: Terraform root module to validate
        type: string
        default: "."
      terraform-version:
        type: string
        default: latest
      bicep-directory:
        description: Directory containing Bicep templates
        type: string
        default: bicep
      cloudformation-directory:
        description: Directory containing CloudFormation templates
        type: string
        default: cloudformation
      codeql-language:
        description: One CodeQL language present in the repository; call separately for other languages
        type: string
        default: javascript-typescript
      severity:
        description: Comma-separated Trivy severity levels that count as findings
        type: string
        default: HIGH,CRITICAL
    secrets:
      github-security-token:
        description: Optional read-only token for enabled Dependabot and secret-scanning alert APIs
        required: false
      renovate-token:
        description: Optional bot PAT or GitHub App token for advanced-mode dependency PRs
        required: false

# No workflow-level permissions: the security group must be able to inherit
# security-events: write for CodeQL. Every other job is limited explicitly.

defaults:
  run:
    shell: bash

jobs:
  configuration:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Validate mode
        env:
          MODE: ${{ inputs.mode }}
        run: '"$RUNNER_TEMP/action-devops-scripts/validate-config.sh"'

  quality:
    needs: configuration
    if: inputs.lint
    permissions:
      contents: read
    uses: $/.github/workflows/quality.yml
    with:
      mode: ${{ inputs.mode }}
      lint: ${{ inputs.lint }}

  build-test:
    needs: configuration
    if: inputs.python || inputs.docker
    permissions:
      contents: read
    uses: $/.github/workflows/build-test.yml
    with:
      mode: ${{ inputs.mode }}
      python: ${{ inputs.python }}
      docker: ${{ inputs.docker }}
      python-version: ${{ inputs.python-version }}
      python-requirements: ${{ inputs.python-requirements }}
      python-command: ${{ inputs.python-command }}
      docker-context: ${{ inputs.docker-context }}
      dockerfile: ${{ inputs.dockerfile }}

  iac:
    needs: configuration
    if: inputs.terraform || inputs.bicep || inputs.cloudformation
    permissions:
      contents: read
    uses: $/.github/workflows/iac.yml
    with:
      mode: ${{ inputs.mode }}
      terraform: ${{ inputs.terraform }}
      bicep: ${{ inputs.bicep }}
      cloudformation: ${{ inputs.cloudformation }}
      terraform-directory: ${{ inputs.terraform-directory }}
      terraform-version: ${{ inputs.terraform-version }}
      bicep-directory: ${{ inputs.bicep-directory }}
      cloudformation-directory: ${{ inputs.cloudformation-directory }}

  security:
    needs: configuration
    if: >-
      inputs.trivy || inputs.iac-security || inputs.codeql ||
      inputs.dependabot || inputs.dependency-review || inputs.secret-scanning
    uses: $/.github/workflows/security.yml
    with:
      mode: ${{ inputs.mode }}
      trivy: ${{ inputs.trivy }}
      iac-security: ${{ inputs.iac-security }}
      codeql: ${{ inputs.codeql }}
      codeql-language: ${{ inputs.codeql-language }}
      dependabot: ${{ inputs.dependabot }}
      dependency-review: ${{ inputs.dependency-review }}
      secret-scanning: ${{ inputs.secret-scanning }}
      severity: ${{ inputs.severity }}
    secrets:
      github-security-token: ${{ secrets.github-security-token }}

  dependencies:
    needs: configuration
    if: inputs.versions
    permissions:
      contents: read
    uses: $/.github/workflows/dependencies.yml
    with:
      mode: ${{ inputs.mode }}
      versions: ${{ inputs.versions }}
    secrets:
      renovate-token: ${{ secrets.renovate-token }}

  summary:
    needs: [configuration, quality, build-test, iac, security, dependencies]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Summarize results and enforce policy
        env:
          RESULTS: ${{ toJSON(needs) }}
          MODE: ${{ inputs.mode }}
        run: python3 "$RUNNER_TEMP/action-devops-scripts/summarize.py"
