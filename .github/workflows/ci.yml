name: CI

# Dogfood: run this repository's own checks from the current commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: $/.github/workflows/allinone.yml
    with:
      mode: restrict
      trivy: false
      iac-security: false
      versions: false
      python: true
      python-command: python -m unittest discover -s tests -v

  audit:
    uses: $/.github/workflows/allinone.yml
    with:
      # Keep upstream-dependent findings visible without making them merge gates.
      mode: audit
      lint: false
      python: true
      python-command: exit 17

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run unit and fixture tests
        run: python3 -m unittest discover -s tests -v
      # Tests the root action from this checkout, as callers would use it.
      - uses: ./
        with:
          mode: audit
          checkout: "false"
      - name: Verify audit mode tolerates a controlled check failure
        id: action-audit
        continue-on-error: true
        uses: ./
        with:
          mode: audit
          checkout: "false"
          lint: "false"
          python: "true"
          python-command: exit 17
          trivy: "false"
          iac-security: "false"
          versions: "false"
      - name: Assert audit failure was tolerated
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.action-audit.outcome }}
        run: test "$ACTION_OUTCOME" = success
      - name: Verify restrict mode rejects a controlled check failure
        id: action-restrict
        continue-on-error: true
        uses: ./
        with:
          mode: restrict
          checkout: "false"
          lint: "false"
          python: "true"
          python-command: exit 17
          trivy: "false"
          iac-security: "false"
          versions: "false"
      - name: Assert restrict failure was propagated
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.action-restrict.outcome }}
        run: test "$ACTION_OUTCOME" = failure
