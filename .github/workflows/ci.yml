name: CI

# Dogfood: run this repository's own checks from the current commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    uses: $/.github/workflows/allinone.yml
    with:
      runner: ${{ matrix.runner }}
      mode: restrict
      trivy: false
      iac-security: false
      versions: false
      python: true
      python-command: python -m unittest discover -s tests -v
      node: true
      node-command: node --version
      go: true
      go-version: stable
      go-command: go version
      dotnet: true
      dotnet-command: dotnet --info
      terraform: true
      terraform-directory: tests/fixtures/iac/terraform
      tflint: true
      bicep: true
      bicep-directory: tests/fixtures/iac/bicep
      cloudformation: true
      cloudformation-directory: tests/fixtures/iac/cloudformation

  audit:
    uses: $/.github/workflows/allinone.yml
    with:
      # Keep upstream-dependent findings visible without making them merge gates.
      mode: audit
      lint: false

  action:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Run unit and fixture tests
        run: python -m unittest discover -s tests -v
      # Test the workspace checkout, not a separately downloaded action.
      - uses: ./ # zizmor: ignore[self-repository]
        with:
          mode: restrict
          checkout: "false"
          lint: "false"
          trivy: "false"
          versions: "false"
          iac-security: "false"
          node: "true"
          node-command: node --version
          go: "true"
          go-version: stable
          go-command: go version
          dotnet: "true"
          dotnet-command: dotnet --info
          terraform: "true"
          tflint: "true"
          terraform-directory: tests/fixtures/iac/terraform
          bicep: "true"
          bicep-directory: tests/fixtures/iac/bicep
          cloudformation: "true"
          cloudformation-directory: tests/fixtures/iac/cloudformation
      - name: Verify Checkov reports controlled findings
        working-directory: tests/fixtures/checkov
        env:
          SCRIPTS: ${{ github.workspace }}/.github/scripts
        run: |
          source "$SCRIPTS/runtime.sh"
          status=0
          bash "$SCRIPTS/checkov-scan.sh" || status=$?
          test "$status" -eq 1
          grep -q "Failed checks:" "$RUNNER_TEMP/checkov.log"
      - name: Reject Linux-only action checks on other runners
        id: action-platform
        if: runner.os != 'Linux'
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository]
        with:
          mode: audit
          checkout: "false"
          lint: "true"
          trivy: "false"
          versions: "false"
          iac-security: "false"
      - name: Assert unsupported checks were rejected
        if: always() && runner.os != 'Linux'
        env:
          ACTION_OUTCOME: ${{ steps.action-platform.outcome }}
        run: test "$ACTION_OUTCOME" = failure
      - name: Verify audit mode tolerates a controlled check failure
        id: action-audit
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository]
        with:
          mode: audit
          checkout: "false"
          lint: "false"
          python: "true"
          python-command: exit 17
          trivy: "false"
          iac-security: "false"
          versions: "false"
      - name: Assert audit failure was tolerated
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.action-audit.outcome }}
        run: test "$ACTION_OUTCOME" = success
      - name: Verify restrict mode rejects a controlled check failure
        id: action-restrict
        continue-on-error: true
        uses: ./ # zizmor: ignore[self-repository]
        with:
          mode: restrict
          checkout: "false"
          lint: "false"
          python: "true"
          python-command: exit 17
          trivy: "false"
          iac-security: "false"
          versions: "false"
      - name: Assert restrict failure was propagated
        if: always()
        env:
          ACTION_OUTCOME: ${{ steps.action-restrict.outcome }}
        run: test "$ACTION_OUTCOME" = failure
