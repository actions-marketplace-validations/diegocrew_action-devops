name: CI

# Dogfood: run this repository's own checks from the current commit.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: $/.github/workflows/allinone.yml
    with:
      # Audit: scanners and version lookups report without blocking merges.
      # The summary check still fails on invalid configuration or broken wiring.
      mode: audit

  action:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./
        with:
          mode: audit
          checkout: "false"
