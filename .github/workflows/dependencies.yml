name: Dependencies

on:
  workflow_call:
    inputs:
      mode:
        description: "audit (report), restrict (fail), or advanced (report and attempt dependency PRs)"
        type: string
        default: audit
      versions:
        description: Check dependency versions, including Actions and Terraform providers
        type: boolean
        default: true
    secrets:
      renovate-token:
        description: Optional bot PAT or GitHub App token for advanced-mode dependency PRs
        required: false
    outputs:
      versions:
        value: ${{ jobs.versions.outputs.result }}
      fixes:
        value: ${{ jobs.fixes.outputs.result }}

# Each job sets its own minimal permissions.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  versions:
    if: inputs.versions
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Look up dependency updates at the checked-out revision
        env:
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/action-devops-scripts/renovate-lookup.sh"'
      - name: Report outdated dependencies
        env:
          REPORT: ${{ runner.temp }}/action-devops-renovate.json
        run: python3 "$RUNNER_TEMP/action-devops-scripts/renovate-report.py"

  fixes:
    if: >-
      inputs.mode == 'advanced' && inputs.versions &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      contains(fromJSON('["push", "schedule", "workflow_dispatch"]'), github.event_name)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - name: Check bot credentials
        env:
          BOT_TOKEN: ${{ secrets.renovate-token }}
        run: |
          if [[ -z "$BOT_TOKEN" ]]; then
            echo "::error::Pass renovate-token to enable dependency fix PRs"
            exit 1
          fi
      - name: Attempt dependency fix PRs
        uses: renovatebot/github-action@2804199d260ad00c1fae0e9e842888369391c776 # v46.3.10
        with:
          token: ${{ secrets.renovate-token }}
          renovate-version: 44.182.0
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ONBOARDING: "false"
          RENOVATE_REQUIRE_CONFIG: optional
          RENOVATE_AUTOMERGE: "false"
          RENOVATE_FORCE: '{"automerge": false, "platformAutomerge": false}'
          RENOVATE_ALLOW_SCRIPTS: "false"
          RENOVATE_IGNORE_SCRIPTS: "true"
          RENOVATE_ALLOWED_COMMANDS: "[]"
          RENOVATE_PR_HOURLY_LIMIT: "2"
