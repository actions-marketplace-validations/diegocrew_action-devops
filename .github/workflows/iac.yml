name: Infrastructure as code

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label for portable checks
        type: string
        default: ubuntu-latest
      mode:
        description: "audit or advanced (report) or restrict (fail)"
        type: string
        default: audit
      terraform:
        description: Check formatting and validate Terraform without a backend
        type: boolean
        default: false
      bicep:
        description: Compile and validate Bicep templates without deploying
        type: boolean
        default: false
      cloudformation:
        description: Lint CloudFormation templates
        type: boolean
        default: false
      tflint:
        description: Lint Terraform root modules with TFLint
        type: boolean
        default: false
      terraform-directory:
        description: Terraform root modules to check, comma- or newline-separated
        type: string
        default: "."
      terraform-version:
        type: string
        default: latest
      tflint-version:
        type: string
        default: v0.65.0
      bicep-directory:
        description: Directory containing Bicep templates
        type: string
        default: bicep
      cloudformation-directory:
        description: Directory containing CloudFormation templates
        type: string
        default: cloudformation
    outputs:
      terraform:
        value: ${{ jobs.terraform.outputs.result }}
      bicep:
        value: ${{ jobs.bicep.outputs.result }}
      cloudformation:
        value: ${{ jobs.cloudformation.outputs.result }}
      tflint:
        value: ${{ jobs.tflint.outputs.result }}

# Each job sets its own minimal permissions.
permissions: {}

defaults:
  run:
    shell: bash

jobs:
  # Direct callers bypass allinone.yml's validation; reject unknown modes here too.
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate mode
        if: ${{ !contains(fromJSON('["audit", "restrict", "advanced"]'), inputs.mode) }}
        run: |
          echo "::error::mode must be audit, restrict, or advanced"
          exit 1

  terraform:
    needs: mode
    if: inputs.terraform
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Format and validate root modules
        env:
          TF_DIRECTORY: ${{ inputs.terraform-directory }}
        run: '"$RUNNER_TEMP/action-devops-scripts/terraform-validate.sh"'

  tflint:
    needs: mode
    if: inputs.tflint
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: ${{ inputs.tflint-version }}
          tflint_wrapper: false
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      # The token only raises GitHub API rate limits for plugin downloads; the
      # lint step that runs plugin code does not receive it.
      - name: Install TFLint plugins
        env:
          TF_DIRECTORY: ${{ inputs.terraform-directory }}
          GITHUB_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/action-devops-scripts/tflint.sh" init'
      - name: Lint root modules
        env:
          TF_DIRECTORY: ${{ inputs.terraform-directory }}
        run: '"$RUNNER_TEMP/action-devops-scripts/tflint.sh" lint'

  bicep:
    needs: mode
    if: inputs.bicep
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Compile Bicep templates
        env:
          BICEP_DIRECTORY: ${{ inputs.bicep-directory }}
        run: '"$RUNNER_TEMP/action-devops-scripts/bicep-build.sh"'

  cloudformation:
    needs: mode
    if: inputs.cloudformation
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 20
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Lint CloudFormation templates
        env:
          CFN_DIRECTORY: ${{ inputs.cloudformation-directory }}
        run: '"$RUNNER_TEMP/action-devops-scripts/cloudformation-lint.sh"'
