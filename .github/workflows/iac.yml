name: Infrastructure as code

on:
  workflow_call:
    inputs:
      mode:
        description: "audit or advanced (report) or restrict (fail)"
        type: string
        default: audit
      terraform:
        description: Check formatting and validate Terraform without a backend
        type: boolean
        default: false
      bicep:
        description: Compile and validate Bicep templates without deploying
        type: boolean
        default: false
      cloudformation:
        description: Lint CloudFormation templates
        type: boolean
        default: false
      terraform-directory:
        description: Terraform root module to validate
        type: string
        default: "."
      terraform-version:
        type: string
        default: latest
      bicep-directory:
        description: Directory containing Bicep templates
        type: string
        default: bicep
      cloudformation-directory:
        description: Directory containing CloudFormation templates
        type: string
        default: cloudformation
    outputs:
      terraform:
        value: ${{ jobs.terraform.outputs.result }}
      bicep:
        value: ${{ jobs.bicep.outputs.result }}
      cloudformation:
        value: ${{ jobs.cloudformation.outputs.result }}

defaults:
  run:
    shell: bash

jobs:
  terraform:
    if: inputs.terraform
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Format and validate root module
        env:
          TF_DIRECTORY: ${{ inputs.terraform-directory }}
        run: '"$RUNNER_TEMP/action-devops-scripts/terraform-validate.sh"'

  bicep:
    if: inputs.bicep
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Compile Bicep templates
        env:
          BICEP_DIRECTORY: ${{ inputs.bicep-directory }}
        run: '"$RUNNER_TEMP/action-devops-scripts/bicep-build.sh"'

  cloudformation:
    if: inputs.cloudformation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Lint CloudFormation templates
        env:
          CFN_DIRECTORY: ${{ inputs.cloudformation-directory }}
        run: '"$RUNNER_TEMP/action-devops-scripts/cloudformation-lint.sh"'
