name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # checkov:skip=CKV_GHA_7: republishes notes for an existing tag; nothing is built
    inputs:
      tag:
        description: Existing release tag to republish with notes from the selected branch
        type: string
        required: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Publish release from docs/releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_HOST: ${{ github.server_url }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: .github/scripts/create-release.sh
