name: Security

on:
  workflow_call:
    inputs:
      mode:
        description: "audit or advanced (report) or restrict (fail)"
        type: string
        default: audit
      trivy:
        description: Scan vulnerabilities, secrets, and infrastructure misconfiguration
        type: boolean
        default: true
      iac-security:
        description: Run Checkov security and best-practice checks on IaC
        type: boolean
        default: true
      codeql:
        description: Opt in to GitHub CodeQL analysis and code-scanning uploads
        type: boolean
        default: false
      codeql-language:
        description: CodeQL languages present in the repository, comma- or newline-separated
        type: string
        default: javascript-typescript
      dependabot:
        description: Check existing open high and critical GitHub Dependabot alerts
        type: boolean
        default: false
      dependency-review:
        description: Review newly introduced vulnerable dependencies on pull requests
        type: boolean
        default: false
      secret-scanning:
        description: Check existing open GitHub secret-scanning alerts
        type: boolean
        default: false
      severity:
        description: Comma-separated Trivy severity levels that count as findings
        type: string
        default: HIGH,CRITICAL
    secrets:
      github-security-token:
        description: Optional read-only token for enabled Dependabot and secret-scanning alert APIs
        required: false
    outputs:
      trivy:
        value: ${{ jobs.trivy.outputs.result }}
      iac-security:
        value: ${{ jobs.iac-security.outputs.result }}
      codeql:
        value: ${{ jobs.codeql.outputs.result }}
      dependabot:
        value: ${{ jobs.dependabot.outputs.result }}
      dependency-review:
        value: ${{ jobs.dependency-review.outputs.result }}
      secret-scanning:
        value: ${{ jobs.secret-scanning.outputs.result }}

# No workflow-level permissions: codeql inherits the caller's token so that
# callers not using CodeQL never have to grant security-events: write. Every
# other job sets its own minimal permissions.

defaults:
  run:
    shell: bash

jobs:
  # Direct callers bypass allinone.yml's validation; reject unknown modes here too.
  mode:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Validate mode
        if: ${{ !contains(fromJSON('["audit", "restrict", "advanced"]'), inputs.mode) }}
        run: |
          echo "::error::mode must be audit, restrict, or advanced"
          exit 1

  trivy:
    needs: mode
    if: inputs.trivy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Scan repository
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: ${{ inputs.severity }}
          exit-code: "1"
          format: table
          version: v0.76.1

  iac-security:
    needs: mode
    if: inputs.iac-security
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Scan infrastructure as code
        run: '"$RUNNER_TEMP/action-devops-scripts/checkov-scan.sh"'

  codeql-languages:
    needs: mode
    if: inputs.codeql
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions: {}
    outputs:
      languages: ${{ steps.languages.outputs.languages }}
    steps:
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Validate languages
        id: languages
        env:
          CODEQL_LANGUAGE: ${{ inputs.codeql-language }}
        run: '"$RUNNER_TEMP/action-devops-scripts/codeql-language.sh"'

  # One analysis per language. Each leg records its own status under a
  # language-named output; matrix outputs with unique names are merged.
  codeql-analyze:
    needs: [mode, codeql-languages]
    if: inputs.codeql && needs.codeql-languages.outputs.languages != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(needs.codeql-languages.outputs.languages) }}
    outputs:
      javascript-typescript: ${{ steps.result.outputs.javascript-typescript }}
      python: ${{ steps.result.outputs.python }}
      ruby: ${{ steps.result.outputs.ruby }}
      c-cpp: ${{ steps.result.outputs.c-cpp }}
      go: ${{ steps.result.outputs.go }}
      java-kotlin: ${{ steps.result.outputs.java-kotlin }}
      csharp: ${{ steps.result.outputs.csharp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          languages: ${{ matrix.language }}
          queries: security-extended
          build-mode: ${{ contains(fromJSON('["c-cpp", "go", "java-kotlin", "csharp"]'), matrix.language) && 'autobuild' || 'none' }}
      - uses: github/codeql-action/autobuild@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        if: contains(fromJSON('["c-cpp", "go", "java-kotlin", "csharp"]'), matrix.language)
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          category: /language:${{ matrix.language }}
      - name: Record result
        id: result
        if: always()
        env:
          LANGUAGE: ${{ matrix.language }}
          STATUS: ${{ job.status }}
        run: echo "$LANGUAGE=$STATUS" >> "$GITHUB_OUTPUT"

  codeql:
    needs: [mode, codeql-languages, codeql-analyze]
    if: always() && inputs.codeql && needs.mode.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions: {}
    outputs:
      result: ${{ job.status }}
    steps:
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Check every language succeeded
        env:
          LANGUAGES: ${{ needs.codeql-languages.outputs.languages }}
          RESULTS: ${{ toJSON(needs.codeql-analyze.outputs) }}
        run: python3 "$RUNNER_TEMP/action-devops-scripts/codeql-results.py"

  dependabot:
    needs: mode
    if: inputs.dependabot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions: {}
    outputs:
      result: ${{ job.status }}
    steps:
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Check open Dependabot alerts
        env:
          GH_TOKEN: ${{ secrets.github-security-token }}
          GH_HOST: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: '"$RUNNER_TEMP/action-devops-scripts/github-alerts.sh" dependabot'

  dependency-review:
    needs: mode
    if: inputs.dependency-review && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions:
      contents: read
    outputs:
      result: ${{ job.status }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: never

  secret-scanning:
    needs: mode
    if: inputs.secret-scanning
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: ${{ inputs.mode != 'restrict' }}
    permissions: {}
    outputs:
      result: ${{ job.status }}
    steps:
      - name: Check out action-devops scripts
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .action-devops
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Move scripts out of the workspace
        run: |
          mv .action-devops/.github/scripts "$RUNNER_TEMP/action-devops-scripts"
          rm -rf .action-devops
      - name: Check open secret-scanning alerts
        env:
          GH_TOKEN: ${{ secrets.github-security-token }}
          GH_HOST: ${{ github.server_url }}
          REPOSITORY: ${{ github.repository }}
        run: '"$RUNNER_TEMP/action-devops-scripts/github-alerts.sh" secret-scanning'
